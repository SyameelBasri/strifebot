name: chatbot_web_app
description: A Flutter web app for chatbot interaction
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  provider: ^6.0.5
  cupertino_icons: ^1.0.2
  file_picker: ^6.1.1
  universal_html: ^2.2.4
  lottie: ^2.7.0
  http: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/strifebot.json 